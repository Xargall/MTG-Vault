<div class="shell">
  <header class="shell-header">
    <svg class="corner-flourish corner-flourish--left" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <path d="M0 22 Q0 0 22 0" stroke="#c9a24a" fill="none" stroke-width="1.5" />
      <circle cx="4" cy="18" r="1.4" fill="#c9a24a" />
    </svg>
    <svg class="corner-flourish corner-flourish--right" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <path d="M0 22 Q0 0 22 0" stroke="#c9a24a" fill="none" stroke-width="1.5" />
      <circle cx="4" cy="18" r="1.4" fill="#c9a24a" />
    </svg>

    <a class="shell-brand" routerLink="/">
      <svg class="shell-logo" width="28" height="28" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="56" fill="#241a12" stroke="#c9a24a" stroke-width="3" />
        <polygon points="60,32 84,60 60,88 36,60" fill="#3d6f96" stroke="#e8cd7a" stroke-width="3" />
        <polygon points="60,44 72,60 60,76 48,60" fill="#efe6cd" opacity="0.55" />
      </svg>
      <span class="shell-title">MTG Vault</span>
    </a>
    <nav class="shell-nav">
      <a routerLink="/">Übersicht</a>
      <a routerLink="/collection">Sammlung</a>
      <a routerLink="/decks">Decks</a>
      <a routerLink="/wishlist">Wishlist</a>
    </nav>
    <button type="button" class="logout-button" (click)="logout()">Logout</button>
  </header>

  <main class="shell-content">
    <router-outlet />
  </main>

  <app-footer />
</div>
