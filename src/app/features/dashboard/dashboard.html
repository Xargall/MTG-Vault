<div class="dashboard">
  <h1>Willkommen bei MTG Vault</h1>

  @if (loading()) {
    <p class="state-message">Lade Sammlung…</p>
  } @else if (errorMessage()) {
    <p class="state-message error">{{ errorMessage() }}</p>
  } @else if (hasCards()) {
    <section class="overview-card">
      <h2>Farbverteilung</h2>
      <app-donut-chart [data]="colorDistribution()" />
    </section>
  } @else {
    <p class="state-message">Noch keine Karten in deiner Sammlung.</p>
  }
</div>
