<div class="shell">
  <header class="shell-header">
    <svg class="corner-flourish corner-flourish--left" width="48" height="48" aria-hidden="true">
      <use href="#flourish-swirl" />
    </svg>
    <svg class="corner-flourish corner-flourish--right" width="48" height="48" aria-hidden="true">
      <use href="#flourish-swirl" />
    </svg>

    <div class="shell-top">
      <a class="shell-brand" routerLink="/">
        <svg class="shell-logo" width="28" height="28" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="56" fill="#241a12" stroke="#c9a24a" stroke-width="3" />
          <polygon points="60,32 84,60 60,88 36,60" fill="#3d6f96" stroke="#e8cd7a" stroke-width="3" />
          <polygon points="60,44 72,60 60,76 48,60" fill="#efe6cd" opacity="0.55" />
        </svg>
        <span class="shell-title">TCG Vault</span>
      </a>

      <div class="shell-controls">
        <select
          class="game-switch"
          [value]="gameService.currentSlug()"
          (change)="setGame($any($event.target).value)"
        >
          <option value="mtg">{{ 'games.mtg' | translate }}</option>
          <option value="yugioh">{{ 'games.yugioh' | translate }}</option>
          <option value="pokemon">{{ 'games.pokemon' | translate }}</option>
        </select>

        <div class="lang-switch">
          <button
            type="button"
            [class.is-active]="translate.currentLang() === 'de'"
            (click)="setLang('de')"
          >
            DE
          </button>
          <button
            type="button"
            [class.is-active]="translate.currentLang() === 'en'"
            (click)="setLang('en')"
          >
            EN
          </button>
        </div>

        <app-user-menu />
      </div>
    </div>

    <nav class="shell-nav">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        {{ 'nav.overview' | translate }}
      </a>
      <a routerLink="/collection" routerLinkActive="is-active">{{ 'nav.collection' | translate }}</a>
      @if (gameService.decksSupported()) {
        <a routerLink="/decks" routerLinkActive="is-active">{{ 'nav.decks' | translate }}</a>
      }
      <a routerLink="/wishlist" routerLinkActive="is-active">{{ 'nav.wishlist' | translate }}</a>
    </nav>
  </header>

  <app-guest-banner />

  <main class="shell-content">
    <router-outlet />
  </main>

  <app-footer />

  @if (showGeminiOnboarding()) {
    <app-gemini-onboarding-dialog
      (setup)="dismissGeminiOnboarding()"
      (dismiss)="dismissGeminiOnboarding()"
    />
  }
</div>
