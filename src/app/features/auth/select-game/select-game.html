<div class="select-game-page">
  <header class="select-game-header">
    <svg class="brand-logo" width="28" height="28" viewBox="0 0 120 120" aria-hidden="true">
      <use href="#logo-seal" />
    </svg>
    <span class="brand-title">TCG Vault</span>
  </header>

  <main class="select-game-body">
    <h1>{{ 'selectGame.title' | translate }}</h1>
    <p class="subtitle">{{ 'selectGame.subtitle' | translate }}</p>

    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }

    <div class="game-grid">
      <button
        type="button"
        class="game-tile"
        [class.is-active]="gameService.currentSlug() === 'mtg'"
        [disabled]="choosing() !== null"
        (click)="choose('mtg')"
      >
        <span class="game-badge">MTG</span>
        <span class="game-name">{{ 'games.mtg' | translate }}</span>
        <span class="game-count">
          {{ 'selectGame.cardsInCollection' | translate: { count: loading() ? '…' : cardCountFor('mtg') } }}
        </span>
      </button>

      <button
        type="button"
        class="game-tile"
        [class.is-active]="gameService.currentSlug() === 'yugioh'"
        [disabled]="choosing() !== null"
        (click)="choose('yugioh')"
      >
        <span class="game-badge">YGO</span>
        <span class="game-name">{{ 'games.yugioh' | translate }}</span>
        <span class="game-count">
          {{ 'selectGame.cardsInCollection' | translate: { count: loading() ? '…' : cardCountFor('yugioh') } }}
        </span>
      </button>

      <button
        type="button"
        class="game-tile"
        [class.is-active]="gameService.currentSlug() === 'pokemon'"
        [disabled]="choosing() !== null"
        (click)="choose('pokemon')"
      >
        <span class="game-badge">PKM</span>
        <span class="game-name">{{ 'games.pokemon' | translate }}</span>
        <span class="game-count">
          {{ 'selectGame.cardsInCollection' | translate: { count: loading() ? '…' : cardCountFor('pokemon') } }}
        </span>
      </button>

      <div class="game-tile is-disabled">
        <span class="game-badge" aria-hidden="true"><svg aria-hidden="true"><use href="#icon-diamond" /></svg></span>
        <span class="game-name">{{ 'selectGame.moreGames' | translate }}</span>
        <span class="coming-soon-badge">{{ 'games.comingSoon' | translate }}</span>
      </div>
    </div>
  </main>
</div>
