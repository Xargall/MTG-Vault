<div
  class="playtest-card-inner"
  [class.flipping]="flipping()"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  @if (faceDown()) {
    <!-- The real MTG card back (see DESIGN.md's documented exception to its
         own "no official brand art as decoration" rule) - for the "feeling"
         of a physical table, deliberately chosen over an original motif. -->
    <img class="card-back" src="/playtest/mtg-card-back.jpg" alt="" aria-hidden="true" />
  } @else if (card().imageUrlSmall ?? card().imageUrl; as url) {
    <img
      class="card-face"
      [class.skeleton-shimmer]="!imageLoaded()"
      [src]="url"
      [alt]="card().name"
      loading="lazy"
      (load)="imageLoaded.set(true)"
    />
  } @else {
    <div class="card-placeholder">{{ card().name }}</div>
  }
</div>
