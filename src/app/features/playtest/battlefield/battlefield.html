<div class="battlefield-surface" [class.drop-active]="dropActive()" (click)="selectedInstanceId.set(null)">
  <span class="battlefield-band-label battlefield-band-label--creatures" aria-hidden="true">{{ 'playtest.creaturesBand' | translate }}</span>
  <span class="battlefield-band-label battlefield-band-label--lands" aria-hidden="true">{{ 'playtest.landsBand' | translate }}</span>
  @if (combatReminder(); as text) {
    <p class="battlefield-combat-reminder" aria-live="polite">{{ text }}</p>
  }
  @for (card of cards(); track card.instanceId) {
    <div
      class="battlefield-card"
      [class.tapped]="card.tapped"
      [class.is-selected]="selectedInstanceId() === card.instanceId"
      cdkDrag
      [cdkDragFreeDragPosition]="{ x: card.x, y: card.y }"
      (cdkDragEnded)="onDragEnded(card.instanceId, $event)"
      (click)="selectCard(card.instanceId, $event)"
    >
      <app-playtest-card [card]="card.card" [tapped]="card.tapped" />
      <!-- Icon-only, hidden until hover (mouse) or tap-to-select (touch) -
           three permanently-visible text buttons under every 100px card
           both crowded the table and didn't read as buttons (feedback,
           2026-11-03). -->
      <div class="battlefield-card-actions">
        <button
          type="button"
          class="battlefield-card-action"
          [class.active]="card.tapped"
          [attr.aria-label]="(card.tapped ? 'playtest.untap' : 'playtest.tap') | translate"
          (click)="tapToggled.emit(card.instanceId)"
        >
          <svg aria-hidden="true"><use href="#icon-tap" /></svg>
        </button>
        <button
          type="button"
          class="battlefield-card-action"
          [attr.aria-label]="'playtest.graveyard' | translate"
          (click)="sentToGraveyard.emit(card.instanceId)"
        >
          <svg aria-hidden="true"><use href="#icon-graveyard" /></svg>
        </button>
        <button
          type="button"
          class="battlefield-card-action"
          [attr.aria-label]="'playtest.exile' | translate"
          (click)="sentToExile.emit(card.instanceId)"
        >
          <svg aria-hidden="true"><use href="#icon-exile" /></svg>
        </button>
      </div>
    </div>
  }
</div>
