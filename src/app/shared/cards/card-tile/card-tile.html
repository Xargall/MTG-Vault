<div class="card-tile" [class.card-tile--missing]="status() === 'missing'" [class.card-tile--partial]="status() === 'partial'">
  @if (quantity() !== null) {
    <span class="quantity-badge">×{{ quantity() }}</span>
  }

  @if (status(); as s) {
    <span class="status-badge status-badge--{{ s }}" aria-hidden="true">
      @if (s === 'owned') {
        ✓
      } @else if (s === 'partial') {
        !
      } @else {
        ✕
      }
    </span>
  }

  @if (card().imageUrl; as url) {
    <img class="card-image" [src]="url" [alt]="card().name" />
  } @else {
    <div class="card-placeholder">{{ card().name }}</div>
  }

  <p class="card-name">{{ card().name }}</p>
</div>
