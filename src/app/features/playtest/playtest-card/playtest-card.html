<div class="playtest-card-inner" [class.flipping]="flipping()">
  @if (faceDown()) {
    <!-- Original emblem, not a reproduction of any real MTG card back (see
         DESIGN.md Don'ts) - the same diamond-with-four-rays "Rauten-Siegel"
         motif already used as the page background's --pattern-seal-faint
         texture, here promoted to a single legible glyph. -->
    <div class="card-back" aria-hidden="true">
      <svg class="card-back-seal" viewBox="0 0 100 100">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polygon points="50,35 65,50 50,65 35,50" />
          <line x1="50" y1="10" x2="50" y2="20" />
          <line x1="50" y1="80" x2="50" y2="90" />
          <line x1="10" y1="50" x2="20" y2="50" />
          <line x1="80" y1="50" x2="90" y2="50" />
        </g>
      </svg>
    </div>
  } @else if (card().imageUrlSmall ?? card().imageUrl; as url) {
    <img
      class="card-face"
      [class.skeleton-shimmer]="!imageLoaded()"
      [src]="url"
      [alt]="card().name"
      loading="lazy"
      (load)="imageLoaded.set(true)"
    />
  } @else {
    <div class="card-placeholder">{{ card().name }}</div>
  }
</div>
