<app-dialog [heading]="'geminiOnboarding.title' | translate" maxWidth="420px" (closeRequest)="dismiss.emit()">
  <p class="message">{{ 'geminiOnboarding.message' | translate }}</p>

  <div class="button-row">
    <a routerLink="/settings/gemini" class="btn btn--primary" (click)="setup.emit()">
      {{ 'geminiOnboarding.setupNow' | translate }}
    </a>
    <button type="button" class="btn btn--secondary" (click)="dismiss.emit()">
      {{ 'geminiOnboarding.later' | translate }}
    </button>
  </div>
</app-dialog>
