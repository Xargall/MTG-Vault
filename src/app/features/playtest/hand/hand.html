<div class="hand-row">
  @for (item of cards(); track item.instanceId; let i = $index, count = $count) {
    <div
      class="hand-card"
      [style.--fan-rotate]="(i - (count - 1) / 2) * fanStepDeg + 'deg'"
      cdkDrag
      (cdkDragMoved)="onDragMoved($event)"
      (cdkDragEnded)="onDragEnded(item.instanceId, $event)"
    >
      <app-playtest-card [card]="item.card" />
      <button
        type="button"
        class="hand-card-discard"
        [attr.aria-label]="'playtest.discard' | translate"
        (click)="cardDiscarded.emit(item.instanceId)"
      >
        <svg aria-hidden="true"><use href="#icon-close" /></svg>
      </button>
    </div>
  }
</div>
