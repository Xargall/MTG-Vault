<button type="button" class="zone-pile" [disabled]="cards().length === 0" (click)="primaryAction.emit()">
  @if (topCard(); as top) {
    <app-playtest-card [card]="top.card" [faceDown]="faceDown()" />
  } @else {
    <div class="zone-pile-empty" aria-hidden="true"></div>
  }
  <span class="zone-pile-count">{{ cards().length }}</span>
</button>
<span class="zone-pile-label">{{ label() }}</span>
