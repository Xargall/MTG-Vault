name: Deploy frontend

# Path/credentials verified via several manual dry runs first (see commit
# history) - server-dir is "/" because the FTP account used here is itself
# scoped to the tcg-vault directory, not the wider webspace.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # src/environments/environment.ts is gitignored (see .gitignore) and
      # only exists on developer machines - the build fails without it
      # (confirmed live: esbuild "Could not resolve ... environment").
      # Reconstructed here from repo secrets rather than committing it,
      # keeping the same not-checked-in convention the local setup already
      # uses (see src/environments/environment.example.ts).
      - name: Write environment.ts
        run: |
          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: true,
            supabaseUrl: '${{ secrets.SUPABASE_URL }}',
            supabaseAnonKey: '${{ secrets.SUPABASE_ANON_KEY }}',
          };
          EOF

      - run: npm ci
      - run: npm run build

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/MTG-Vault/browser/
          server-dir: /
